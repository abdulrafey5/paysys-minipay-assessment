apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipay-ui
  namespace: minipay
spec:
  replicas: 1
  selector:
    matchLabels: { app: minipay-ui }
  template:
    metadata:
      labels: { app: minipay-ui }
    spec:
      containers:
        - name: ui
          image: minipay-ui:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: minipay-ui
  namespace: minipay
spec:
  selector: { app: minipay-ui }
  ports:
    - port: 80
      targetPort: 80
