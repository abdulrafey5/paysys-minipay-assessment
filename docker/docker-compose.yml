version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: minipay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: minipay
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: minipay_local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - minipay_pgdata:/var/lib/postgresql/data
      - ../app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipay -d minipay"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../app/api
      dockerfile: Dockerfile
    container_name: minipay-api
    restart: unless-stopped
    environment:
      MINIPAY_DB_HOST: db
      MINIPAY_DB_PORT: "5432"
      MINIPAY_DB_NAME: minipay
      MINIPAY_DB_USER: minipay
      MINIPAY_DB_PASSWORD: minipay_local_dev_only
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ../app/ui
      dockerfile: Dockerfile
    container_name: minipay-ui
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  minipay_pgdata:
