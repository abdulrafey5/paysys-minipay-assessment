<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MiniPay — Minimal Console</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; margin-top: 2.2rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  label { display: block; font-size: 0.85rem; margin-top: 10px; margin-bottom: 3px; color: #444; }
  input { width: 100%; padding: 7px 9px; box-sizing: border-box; font-size: 0.95rem; }
  button { margin-top: 14px; padding: 8px 16px; cursor: pointer; }
  pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; }
  .ok { border-left: 4px solid #2e8b57; }
  .err { border-left: 4px solid #c0392b; }
  #apiBase { font-size: 0.8rem; color: #666; }
</style>
</head>
<body>

<h1>MiniPay Console</h1>
<p id="apiBase">API base: <code id="apiBaseVal"></code> · <span id="healthStatus">checking health…</span></p>

<h2>Create Customer</h2>
<label>Customer ref</label>
<input id="custRef" placeholder="CUST000001">
<label>Name</label>
<input id="custName" placeholder="Jane Doe">
<button onclick="createCustomer()">Create Customer</button>
<pre id="custResult"></pre>

<h2>Create Payment</h2>
<label>Customer ref</label>
<input id="payCustRef" placeholder="CUST000001">
<label>Transaction ref</label>
<input id="payTxRef" placeholder="TXN00000001">
<label>Amount</label>
<input id="payAmount" type="number" step="0.01" placeholder="150.00">
<label><input type="checkbox" id="forceFailure" style="width:auto; display:inline-block;"> force_failure (testing aid)</label>
<button onclick="createPayment()">Create Payment</button>
<pre id="payResult"></pre>

<h2>Look Up Payment</h2>
<label>Transaction ref</label>
<input id="lookupTxRef" placeholder="TXN00000001">
<button onclick="lookupPayment()">Look Up</button>
<pre id="lookupResult"></pre>

<script>
  // API base is resolved at runtime, not build time, so the same static
  // bundle works unchanged across local Docker, k3d, and any future env —
  // just override window.MINIPAY_API_BASE before this script loads, or set it here.
  const API_BASE = window.MINIPAY_API_BASE || `${location.protocol}//${location.hostname}:8080`;
  document.getElementById('apiBaseVal').textContent = API_BASE;

  async function callApi(path, opts) {
    const res = await fetch(API_BASE + path, opts);
    let body;
    try { body = await res.json(); } catch { body = null; }
    return { status: res.status, headers: res.headers, body };
  }

  function render(el, result) {
    el.textContent = `HTTP ${result.status}\n` + JSON.stringify(result.body, null, 2);
    el.className = result.status >= 200 && result.status < 300 ? 'ok' : 'err';
  }

  async function checkHealth() {
    const elStatus = document.getElementById('healthStatus');
    try {
      const r = await callApi('/health');
      elStatus.textContent = r.body && r.body.status === 'ok' ? '● healthy' : '● degraded';
      elStatus.style.color = r.body && r.body.status === 'ok' ? '#2e8b57' : '#c0392b';
    } catch (e) {
      elStatus.textContent = '● unreachable';
      elStatus.style.color = '#c0392b';
    }
  }

  async function createCustomer() {
    const el = document.getElementById('custResult');
    const customer_ref = document.getElementById('custRef').value.trim();
    const name = document.getElementById('custName').value.trim();
    const r = await callApi('/api/customers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_ref, name })
    });
    render(el, r);
  }

  async function createPayment() {
    const el = document.getElementById('payResult');
    const customer_ref = document.getElementById('payCustRef').value.trim();
    const transaction_ref = document.getElementById('payTxRef').value.trim();
    const amount = parseFloat(document.getElementById('payAmount').value);
    const force_failure = document.getElementById('forceFailure').checked;
    const r = await callApi('/api/payments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customer_ref, transaction_ref, amount, force_failure })
    });
    const replay = r.headers && r.headers.get && r.headers.get('idempotent-replay');
    el.textContent = `HTTP ${r.status}${replay ? ' (Idempotent-Replay: true)' : ''}\n` + JSON.stringify(r.body, null, 2);
    el.className = r.status >= 200 && r.status < 300 ? 'ok' : 'err';
  }

  async function lookupPayment() {
    const el = document.getElementById('lookupResult');
    const ref = document.getElementById('lookupTxRef').value.trim();
    const r = await callApi('/api/payments/' + encodeURIComponent(ref));
    render(el, r);
  }

  checkHealth();
</script>
</body>
</html>
